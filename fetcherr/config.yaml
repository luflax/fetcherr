name: Fetcherr
version: "0.2.0"
slug: fetcherr
description: Search releases with Prowlarr and download them with qBittorrent
url: https://github.com/luflax/fetcherr
arch:
  - amd64
  - aarch64
image: ghcr.io/luflax/fetcherr-{arch}
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8734
panel_icon: mdi:movie-search
panel_title: Fetcherr
ports:
  8734/tcp: 8734
ports_description:
  8734/tcp: Fetcherr web UI, REST API and WebSocket (no authentication)
watchdog: http://[HOST]:[PORT:8734]/health
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warn|error)
