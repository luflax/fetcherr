name: Fetcherr
version: "0.5.0"
slug: fetcherr
description: Browse and request movies and series; download with Prowlarr and qBittorrent into Jellyfin
url: https://github.com/luflax/fetcherr
arch:
  - amd64
  - aarch64
image: ghcr.io/luflax/fetcherr-{arch}
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8734
map:
  - media:rw
  - share:rw
panel_icon: mdi:movie-search
panel_title: Fetcherr
ports:
  8734/tcp: 8734
ports_description:
  8734/tcp: Fetcherr web UI, REST API and WebSockets (the API needs the API key)
watchdog: http://[HOST]:[PORT:8734]/health
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warn|error)
