{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Settings</h1>
</div>
<div class="settings-grid">
  {{ indexer|safe }}
  {{ download_client|safe }}
</div>

<h2 class="section-title">Media types</h2>
<div class="settings-grid">
  {% for card in media_types %}
  {{ card|safe }}
  {% endfor %}
</div>
{% endblock %}
{% block scripts %}
<script src="static/quality-ranking.js?v={{ layout.version }}" defer></script>
{% endblock %}
