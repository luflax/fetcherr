<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="{{ layout.base_href }}">
  <title>{% block title %}Fetcherr{% endblock %} · Fetcherr</title>
  <link rel="stylesheet" href="static/app.css?v={{ layout.version }}">
  <script src="static/htmx.min.js?v={{ layout.version }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">Fetcherr</a>
    <form class="quick-search" action="./" method="get" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="m20 20-4.5-4.5" /></svg>
      <input type="search" name="query" placeholder="Search releases…" aria-label="Search releases">
    </form>
    <a class="topbar-link" href="docs/" target="_blank" rel="noopener">API</a>
  </header>

  <nav class="sidebar" aria-label="Main">
    <a href="./" class="{% if layout.active == "search" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="m20 20-4.5-4.5" /></svg>
      Search
    </a>
    <a href="downloads" class="{% if layout.active == "downloads" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 19h16" /></svg>
      Downloads
    </a>
    <a href="settings" class="{% if layout.active == "settings" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
      Settings
    </a>
  </nav>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
