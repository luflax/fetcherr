<li class="layout-list" data-id="{{ id }}">
  <div class="layout-row">
    <input class="input" data-field="title" value="{{ title }}" placeholder="List title" aria-label="List title">
    <select class="input" data-field="kind" aria-label="Source">
      {% for option in kinds %}<option value="{{ option.value }}"{% if option.selected %} selected{% endif %}>{{ option.label }}</option>{% endfor %}
    </select>
    <select class="input" data-field="media" aria-label="Titles">
      {% for option in medias %}<option value="{{ option.value }}"{% if option.selected %} selected{% endif %}>{{ option.label }}</option>{% endfor %}
    </select>
    <select class="input" data-field="window" aria-label="Trending window">
      {% for option in windows %}<option value="{{ option.value }}"{% if option.selected %} selected{% endif %}>{{ option.label }}</option>{% endfor %}
    </select>
    <span class="layout-buttons">
      <button type="button" class="icon-button" data-action="up" title="Move up" aria-label="Move list up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg></button>
      <button type="button" class="icon-button" data-action="down" title="Move down" aria-label="Move list down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></button>
      <button type="button" class="icon-button danger" data-action="remove" title="Remove" aria-label="Remove list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg></button>
    </span>
  </div>
  <details class="layout-filters">
    <summary>Filters <span class="hint">(discover lists)</span></summary>
    <div class="layout-filter-grid">
      <label class="field">Genre ids<input class="input" data-field="genres" value="{{ genres }}" placeholder="16, 35"></label>
      <label class="field">From year<input class="input" type="number" data-field="year_from" value="{{ year_from }}"></label>
      <label class="field">To year<input class="input" type="number" data-field="year_to" value="{{ year_to }}"></label>
      <label class="field">Min. vote<input class="input" type="number" step="0.1" min="0" max="10" data-field="min_vote" value="{{ min_vote }}"></label>
      <label class="field">Min. votes<input class="input" type="number" min="0" data-field="min_votes" value="{{ min_votes }}"></label>
      <label class="field">Sort by<input class="input" data-field="sort_by" value="{{ sort_by }}" placeholder="popularity.desc"></label>
      <label class="field">Original language<input class="input" data-field="original_language" value="{{ original_language }}" placeholder="ja"></label>
      <label class="field">Watch provider ids<input class="input" data-field="watch_providers" value="{{ watch_providers }}" placeholder="8, 337"></label>
      <label class="field">Watch region<input class="input" data-field="watch_region" value="{{ watch_region }}" placeholder="US" maxlength="2"></label>
    </div>
  </details>
</li>
